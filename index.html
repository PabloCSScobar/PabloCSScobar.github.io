<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pawel.build · things I build</title>
<meta name="description" content="Projects by Paweł: hardware and software side projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.978 0.007 80);
    --surface: oklch(0.996 0.003 80);
    --fg: oklch(0.23 0.014 55);
    --muted: oklch(0.47 0.016 55);
    --border: oklch(0.9 0.012 70);
    --accent: oklch(0.52 0.15 40);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 880px; margin: 0 auto; padding: 96px 24px 64px; }
  h1, h2 { font-family: "Newsreader", Georgia, serif; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: clamp(40px, 6vw, 60px); line-height: 1.05; }
  .lead { color: var(--muted); font-size: 20px; margin: 16px 0 56px; max-width: 34em; }
  .project { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; color: inherit; text-decoration: none; transition: transform 150ms, box-shadow 150ms; }
  .project:hover { transform: translateY(-2px); box-shadow: 0 18px 50px -24px color-mix(in oklab, var(--fg), transparent 60%); }
  .project:focus-visible { outline: 3px solid color-mix(in oklab, var(--accent), transparent 50%); outline-offset: 3px; }
  .project img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .project div { padding: 28px; }
  .project h2 { font-size: 30px; margin-bottom: 8px; }
  .project p { margin: 0 0 16px; color: var(--muted); }
  .more { color: var(--accent); font-weight: 600; }
  footer { max-width: 880px; margin: 0 auto; padding: 32px 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 15px; }
  footer a { color: inherit; }
  @media (max-width: 640px) { main { padding-top: 64px; } .project { grid-template-columns: 1fr; } .project img { aspect-ratio: 16 / 9; } }
</style>
</head>
<body>
<main>
  <h1>Things I build.</h1>
  <p class="lead">Hi, I'm Paweł. I make small hardware and software projects, mostly around music and learning.</p>

  <a class="project" href="/ledsplay/">
    <img src="ledsplay.jpg" alt="A digital piano with a glowing LED strip along the back of the keys" width="1600" height="901">
    <div>
      <h2>LEDsplay</h2>
      <p>Raspberry Pi software that lights up the keys of your digital piano as you play, and shows you which key comes next.</p>
      <span class="more">See the project →</span>
    </div>
  </a>
</main>
<footer>
  <a href="https://github.com/PabloCSScobar" rel="noopener">GitHub</a>
</footer>
</body>
</html>
